# Gateway routes are defined in code (api-gateway's GatewayConfig
# RouteLocator bean), not here - Spring Cloud Gateway route config was
# intentionally moved out of config-server. Only non-route settings
# (server port, Eureka client, actuator, tracing) remain here.

server:
  port: 8080

# `lb://<service-id>` resolves via Eureka, so the gateway must be a registered client.
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    # The gateway actuator endpoint defaults to access=none, so
    # /actuator/gateway/routes 404s even when exposed via the wildcard above.
    # read-only permits GET (inspect resolved routes) but not POST (refresh).
    gateway:
      access: read-only
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}

logging:
  level:
    root: INFO





spring:
  application:
    name: user-service
  # NOTE: `spring.data.mongodb.uri` was deprecated at ERROR level in Boot 4.0
  # and is no longer bound - it silently fell back to the default
  # mongodb://localhost/test, which only appeared to work when the app ran on
  # the same host as the database. The connection settings now live under
  # `spring.mongodb.*`; `spring.data.mongodb.*` keeps only repository settings.
  mongodb:
    uri: ${MONGO_URL:mongodb://localhost:27017/userdb}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
server:
  port: 8082
management:
  tracing:
    sampling:
      probability: 1.0
    # `management.zipkin.tracing.endpoint` is deprecated at ERROR level since
    # Boot 3.2 (silently ignored -> defaulted to localhost:9411).
    export:
      zipkin:
        endpoint: ${ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP:false}
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}

# Used by KeycloakAdminClient to provision a Keycloak user (and assign a realm
# role) whenever a new local User is created. admin-client-id/secret must be a
# CONFIDENTIAL client in this realm with "Service accounts roles" enabled and
# the realm-management client roles "manage-users" and "view-users" granted to
# its service account - it is only used for Admin REST API calls, never for
# end-user login.
keycloak:
  server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8180}
  realm: ${KEYCLOAK_REALM:ecom-app}
  admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:user-service-admin}
  admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:2iaX0dpf1zkXq7k7fLKHj9Yjg2rOs41L}
  default-role: ${KEYCLOAK_DEFAULT_ROLE:USER}

logging:
  level:
    root: INFO
    com.ecom.user: DEBUG
  file:
    name: logs/${spring.application.name}.log


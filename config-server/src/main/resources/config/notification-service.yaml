spring:
  # Let in-flight requests finish when the container/pod gets SIGTERM.
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: notification-service
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
server:
  shutdown: graceful
  port: 8085

rabbitmq:
  exchange:
    name: order-exchange
    queue:
      name: order-queue
    routing-key: order-routing-key

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
      # Exposes /actuator/health/liveness and /actuator/health/readiness for
      # Kubernetes probes.
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
    livenessState:
      enabled: true
    readinessState:
      enabled: true

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP:false}
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}

logging:
  level:
    root: INFO
    com.ecom.notificationservice: DEBUG
  file:
    name: logs/${spring.application.name}.log


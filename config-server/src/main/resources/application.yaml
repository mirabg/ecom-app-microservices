spring:
  application:
    name: config-server
  # Let in-flight requests finish when the container/pod gets SIGTERM.
  lifecycle:
    timeout-per-shutdown-phase: 30s
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config/
  # spring-cloud-starter-bus-amqp is on the classpath, so this app opens an AMQP
  # connection on startup. In a container `localhost` is the container itself.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
server:
  shutdown: graceful
  port: 8888

management:
  # The config server maps /{application}/{profile}, which swallows
  # /actuator/health (it resolves as application="actuator", profile="health").
  # Serving actuator on its own port keeps the probe endpoints reachable - and
  # is good practice anyway, since it keeps them off the public port.
  server:
    port: 8889
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
      # Exposes /actuator/health/liveness and /actuator/health/readiness for
      # Kubernetes probes.
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    # Registering the container's bridge IP makes this instance unreachable from
    # the host; advertise a resolvable hostname instead.
    prefer-ip-address: ${EUREKA_PREFER_IP:false}
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}


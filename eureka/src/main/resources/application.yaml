spring:
  application:
    name: eureka
  # Let in-flight requests finish when the container/pod gets SIGTERM.
  lifecycle:
    timeout-per-shutdown-phase: 30s
server:
  shutdown: graceful
  port: 8761

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
      # Exposes /actuator/health/liveness and /actuator/health/readiness for
      # Kubernetes probes.
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true


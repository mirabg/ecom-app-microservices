services:
  kafka:
    # The old bitnami/kafka:3.5.1 tag was removed from Docker Hub when Bitnami
    # retired its free legacy images, so pulls fail with "not found".
    # apache/kafka is the officially maintained image; it reads plain KAFKA_*
    # env vars (Bitnami's KAFKA_CFG_* prefix does NOT apply here).
    image: apache/kafka:3.9.2
    container_name: kafka_container
    environment:
      # KRaft mode - no ZooKeeper required. The previous config pointed at a
      # `zookeeper` service that was never defined, which made the whole
      # compose project invalid.
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      # Two client listeners so both worlds can connect:
      #   INTERNAL -> other containers on the `backend` network (kafka:29092)
      #   EXTERNAL -> apps running on the host, e.g. services started from the
      #               IDE (localhost:9092)
      # The advertised address is what the broker hands back to clients, so a
      # single `kafka:9092` listener would be unresolvable from the host.
      KAFKA_LISTENERS: "INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      # Single-broker dev cluster: internal topics can't use the default RF of 3.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - backend
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:3.9.29-management
    container_name: rabbitmq-bus
    ports:
      - "5672:5672"   # AMQP protocol port for Spring Cloud Bus
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - backend
    restart: unless-stopped
  postgres:
    container_name: postgres_container
    image: postgres:14
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      PGDATA: /data/postgres
    volumes:
      - postgres:/data/postgres
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
        - "5432:5432"
    networks:
      - backend
    restart: unless-stopped
  zipkin:
    container_name: zipkin_container
    image: openzipkin/zipkin
    ports:
      - "9411:9411"
    networks:
      - backend
    restart: unless-stopped

  eureka:
    container_name: eureka
    build: ./eureka
    ports:
      - "8761:8761"
    networks:
      - backend
    restart: unless-stopped

  config-server:
    container_name: config-server
    build: ./config-server
    ports:
      - "8888:8888"
    environment:
      EUREKA_URL: http://eureka:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: config-server
      # spring-cloud-starter-bus-amqp is on the classpath, so an AMQP
      # connection is opened at startup.
      RABBITMQ_HOST: rabbitmq
    depends_on:
      - eureka
      - rabbitmq
    networks:
      - backend
    restart: unless-stopped
  mongodb:
    container_name: mongodb_container
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    ports:
      - "27017:27017"
    volumes:
      - mongodb:/data/db
    networks:
      - backend
    restart: unless-stopped
  pgadmin:
    container_name: pgadmin_container
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin4@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
        - backend
    restart: unless-stopped

  keycloak:
    container_name: keycloak_container
    image: quay.io/keycloak/keycloak:25.0.6
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: root
      KC_DB_PASSWORD: root
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8180:8080"
    depends_on:
      - postgres
    networks:
      - backend
    restart: unless-stopped

  product-service:
    container_name: product-service
    build: ./product
    ports:
      - "8083:8083"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka:8761/eureka/
      # order-service resolves `http://product-service` through Eureka, so the
      # registered hostname must match this container's network alias.
      EUREKA_INSTANCE_HOSTNAME: product-service
      DB_HOST: postgres
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      RABBITMQ_HOST: rabbitmq
      ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
    volumes:
      - ./logs:/app/logs
    depends_on:
      - config-server
      - postgres
      - rabbitmq
    networks:
      - backend
    restart: unless-stopped

  user-service:
    container_name: user-service
    build: ./user
    ports:
      - "8082:8082"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: user-service
      MONGO_URL: mongodb://root:root@mongodb:27017/userdb?authSource=admin
      RABBITMQ_HOST: rabbitmq
      ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-ecom-app}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-user-service-admin}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-2iaX0dpf1zkXq7k7fLKHj9Yjg2rOs41L}
    volumes:
      - ./logs:/app/logs
    depends_on:
      - config-server
      - mongodb
      - rabbitmq
      - keycloak
    networks:
      - backend
    restart: unless-stopped

  order-service:
    container_name: order-service
    build: ./orders
    ports:
      - "8084:8084"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: order-service
      DB_HOST: postgres
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      RABBITMQ_HOST: rabbitmq
      ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
    volumes:
      - ./logs:/app/logs
    depends_on:
      - config-server
      - postgres
      - rabbitmq
      - product-service
      - user-service
    networks:
      - backend
    restart: unless-stopped

  notification-service:
    container_name: notification-service
    build: ./notification-service
    ports:
      - "8085:8085"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: notification-service
      RABBITMQ_HOST: rabbitmq
      ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
    volumes:
      - ./logs:/app/logs
    depends_on:
      - config-server
      - rabbitmq
    networks:
      - backend
    restart: unless-stopped

  api-gateway:
    container_name: api-gateway
    build: ./api-gateway
    ports:
      - "8080:8080"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://eureka:8761/eureka/
      # Feeds the @Value in GatewayConfig for the eureka-dashboard routes.
      EUREKA_DASHBOARD_URL: http://eureka:8761
      EUREKA_INSTANCE_HOSTNAME: api-gateway
      ZIPKIN_TRACING_ENDPOINT: http://zipkin:9411/api/v2/spans
      # issuer-uri must match the `iss` claim of tokens minted for browser
      # logins against localhost:8180; jwk-set-uri is the URL this container
      # actually calls to fetch signing keys. Setting jwk-set-uri explicitly
      # skips OIDC discovery, so the two are allowed to differ.
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/${KEYCLOAK_REALM:-ecom-app}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:-ecom-app}/protocol/openid-connect/certs
    depends_on:
      # Start-order hint only; the gateway retries the config fetch itself
      # (spring.cloud.config.retry), so readiness is not required here.
      - config-server
    networks:
      - backend
    restart: unless-stopped

networks:
    backend:
      driver: bridge
volumes:
    pgadmin:
    postgres:
    mongodb:
    rabbitmq_data:
    kafka_data:

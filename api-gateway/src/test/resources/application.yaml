# Keep the context-load test hermetic: no config server, no Eureka registration,
# no span export.
spring:
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

management:
  tracing:
    enabled: false

server:
  port: 0

